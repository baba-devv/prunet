[project]
name = "pruning-autograd"
version = "0.1.0"
description = "A from-scratch NumPy autodiff engine and a self-pruning MLP built on it."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Overflow / invalid-value RuntimeWarnings are bugs here, not noise.
filterwarnings = ["error"]
